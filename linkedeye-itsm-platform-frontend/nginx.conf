server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Security Headers — defined in a map-like block and repeated in each location
    # to prevent nginx's add_header inheritance override behavior
    set $security_headers_x_frame "SAMEORIGIN";
    set $security_headers_csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fs-le-dev-inc-api.finspot.in wss://fs-le-dev-inc-api.finspot.in https://fs-le-dev-grafana.finspot.in; frame-src 'self' https://fs-le-dev-grafana.finspot.in;";

    add_header X-Frame-Options $security_headers_x_frame always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $security_headers_csp always;

    # Cache static assets — include security headers via 'always' above
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options $security_headers_x_frame always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $security_headers_csp always;
    }

    # Handle SPA routing - return index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        # Don't cache index.html
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options $security_headers_x_frame always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $security_headers_csp always;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://linkedeye-backend.incident-linkedeye-itsm.svc.cluster.local:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check endpoints for K8s probes
    location /health {
        access_log off;
        return 200 '{"status":"healthy"}';
        add_header Content-Type application/json;
    }

    location /ready {
        access_log off;
        return 200 '{"status":"ready"}';
        add_header Content-Type application/json;
    }

    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
}
