apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkedeye-backend-ingress
  namespace: incident-linkedeye-itsm
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    
    # SSL/TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://fs-le-dev-inc.finspot.in"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    # Proxy Tuning
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    
    # Rate Limiting (Production)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
  labels:
    app.kubernetes.io/name: linkedeye-finspot
    environment: production
    
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - fs-le-dev-inc.finspot.in
    secretName: linkedeye-itsm-tls
  rules:
  - host: fs-le-dev-inc.finspot.in
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: linkedeye-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: linkedeye-frontend
            port:
              number: 80
