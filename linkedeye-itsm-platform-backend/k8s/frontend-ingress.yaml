apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkedeye-frontend-ingress
  namespace: incident-linkedeye-itsm
  annotations:
    kubernetes.io/ingress.class: nginx
    # Remove cert-manager - using existing wildcard cert

    # SSL/TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://fs-le-dev-inc.finspot.in"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # Proxy Settings
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

  labels:
    app.kubernetes.io/name: linkedeye-finspot
    app.kubernetes.io/component: frontend
    environment: production

spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - fs-le-dev-inc.finspot.in
    secretName: finspot-wildcard-tls
  rules:
  - host: fs-le-dev-inc.finspot.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: linkedeye-frontend
            port:
              number: 80
