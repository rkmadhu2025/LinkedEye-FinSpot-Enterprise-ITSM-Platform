apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: itsm-backend-hpa
  namespace: incident-linkedeye-itsm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: linkedeye-backend
  minReplicas: 2
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: itsm-frontend-hpa
  namespace: incident-linkedeye-itsm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: linkedeye-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
