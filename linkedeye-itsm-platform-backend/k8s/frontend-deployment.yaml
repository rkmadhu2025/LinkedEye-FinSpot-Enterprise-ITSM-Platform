apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedeye-frontend
  namespace: incident-linkedeye-itsm
  labels:
    app: linkedeye-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkedeye-frontend
  template:
    metadata:
      labels:
        app: linkedeye-frontend
    spec:
      imagePullSecrets:
      - name: gitlab-registry-auth
      containers:
      - name: frontend
        image: registry.gitlab.com/rajkumar.finspot/finspot-le-dev/linkedeye-frontend:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: linkedeye-frontend
  namespace: incident-linkedeye-itsm
spec:
  selector:
    app: linkedeye-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
