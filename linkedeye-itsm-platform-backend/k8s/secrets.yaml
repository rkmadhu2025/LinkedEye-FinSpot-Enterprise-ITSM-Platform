apiVersion: v1
kind: Secret
metadata:
  name: itsm-backend-secrets
  namespace: incident-linkedeye-itsm
type: Opaque
stringData:
  # IMPORTANT: Replace all placeholder values with real secrets before deploying.
  # Consider using a secrets manager (Vault, Sealed Secrets) instead of plain k8s secrets.
  DATABASE_PASSWORD: "REPLACE_WITH_REAL_SECRET"
  DATABASE_USER: "REPLACE_WITH_REAL_SECRET"
  JWT_SECRET_KEY: "REPLACE_WITH_STRONG_RANDOM_SECRET_MIN_64_CHARS"
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"
  GRAFANA_USERNAME: "REPLACE_WITH_REAL_SECRET"
  GRAFANA_PASSWORD: "REPLACE_WITH_REAL_SECRET"
  STACKSTORM_USERNAME: "REPLACE_WITH_REAL_SECRET"
  STACKSTORM_PASSWORD: "REPLACE_WITH_REAL_SECRET"
  # OAuth2 secrets
  OAUTH2_CLIENT_ID: "REPLACE_WITH_REAL_SECRET"
  OAUTH2_CLIENT_SECRET: "REPLACE_WITH_REAL_SECRET"
