{% extends "base.html" %}

{% block page_title %}Create Incident{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        max-width: 800px;
        margin: 0 auto;
    }
    
    .form-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 24px;
    }
    
    .form-group {
        margin-bottom: 24px;
    }
    
    .form-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
    }
    
    .form-input, .form-select, .form-textarea {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.2s;
    }
    
    .form-input:focus, .form-select:focus, .form-textarea:focus {
        outline: none;
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }
    
    .form-textarea {
        min-height: 120px;
        resize: vertical;
    }
    
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }
    
    .btn-group {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 32px;
    }
    
    .btn {
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, var(--primary-blue), #1d4ed8);
        color: #fff;
    }
    
    .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    
    .btn-secondary {
        background: #fff;
        border: 1px solid var(--border-color);
        color: var(--text-primary);
    }
    
    .btn-secondary:hover {
        background: #f9fafb;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <div style="margin-bottom: 24px;">
        <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">Create New Incident</h1>
        <p style="color: var(--text-secondary);">Report a new incident for immediate attention</p>
    </div>
    
    {% if error %}
    <div style="background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 14px 16px; border-radius: 10px; margin-bottom: 24px;">
        {{ error }}
    </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('create_incident') }}">
        <div class="form-card">
            <div class="form-group">
                <label class="form-label" for="title">Incident Title *</label>
                <input class="form-input" id="title" type="text" name="title" placeholder="Brief description of the incident" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="description">Description *</label>
                <textarea class="form-textarea" id="description" name="description" placeholder="Detailed description of the incident" required></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="category">Category</label>
                    <select class="form-select" id="category" name="category">
                        <option value="">Select Category</option>
                        <option value="database">Database</option>
                        <option value="network">Network</option>
                        <option value="application">Application</option>
                        <option value="infrastructure">Infrastructure</option>
                        <option value="security">Security</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="priority">Priority</label>
                    <select class="form-select" id="priority" name="priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="impact">Impact</label>
                    <select class="form-select" id="impact" name="impact">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="urgency">Urgency</label>
                    <select class="form-select" id="urgency" name="urgency">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
            </div>
            
            <div class="btn-group">
                <a href="{{ url_for('incidents') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Create Incident
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
