{% extends "base.html" %}

{% block title %}Create Account - LinkedEye-FinSpot{% endblock %}

{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, var(--bg-body) 0%, #e8eef5 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
    }
    
    .register-container {
        width: 100%;
        max-width: 580px;
        background: var(--bg-card);
        border-radius: 20px;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.12);
        overflow: hidden;
    }
    
    .register-header {
        background: linear-gradient(135deg, var(--primary-navy) 0%, #1e3a5f 50%, #4c1d95 100%);
        padding: 40px 36px;
        text-align: center;
        color: #fff;
    }
    
    .logo-icon {
        width: 72px;
        height: 72px;
        background: linear-gradient(135deg, var(--primary-blue-light) 0%, var(--purple) 100%);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
    }
    
    .logo-icon i {
        font-size: 36px;
        color: #fff;
    }
    
    .register-header h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
    }
    
    .register-body {
        padding: 36px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
    }
    
    .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 10px;
        font-size: 14px;
        transition: all 0.2s;
    }
    
    .form-input:focus {
        outline: none;
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }
    
    .btn-register {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, var(--primary-navy) 0%, #1e3a5f 100%);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 8px;
    }
    
    .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(15, 28, 63, 0.3);
    }
    
    .alert {
        padding: 14px 16px;
        border-radius: 10px;
        margin-bottom: 24px;
        display: {% if error %}flex{% else %}none{% endif %};
        align-items: center;
        gap: 12px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
    }
    
    .login-link {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
        color: #6b7280;
    }
    
    .login-link a {
        color: var(--primary-blue);
        text-decoration: none;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-header">
        <div class="logo-icon">
            <i class="fas fa-eye"></i>
        </div>
        <h1>Create Account</h1>
        <p>Join LinkedEye-FinSpot ITSM Platform</p>
    </div>
    
    <div class="register-body">
        {% if error %}
        <div class="alert">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label" for="first_name">First Name</label>
                <input class="form-input" id="first_name" type="text" name="first_name" placeholder="Enter your first name" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="last_name">Last Name</label>
                <input class="form-input" id="last_name" type="text" name="last_name" placeholder="Enter your last name" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-input" id="email" type="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" id="password" type="password" name="password" placeholder="Create a password" required minlength="8">
            </div>
            
            <button type="submit" class="btn-register">
                Create Account
            </button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
