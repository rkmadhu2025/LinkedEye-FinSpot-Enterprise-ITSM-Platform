<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LinkedEye-FinSpot Enterprise Incident Management Platform - Sign In">
    <title>LinkedEye-FinSpot | Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-navy: #0f1c3f;
            --primary-navy-light: #1e3a5f;
            --primary-blue: #2563eb;
            --primary-blue-light: #3b82f6;
            --purple: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --bg-gray: #f9fafb;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            background: var(--bg-gray);
        }

        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, var(--primary-navy) 0%, var(--primary-navy-light) 50%, #2d4a6f 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            animation: pulse-bg 15s ease-in-out infinite;
        }

        @keyframes pulse-bg {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(5%, 5%); }
        }

        .brand-section {
            position: relative;
            z-index: 1;
            margin-bottom: 60px;
        }

        .brand-logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary-blue-light) 0%, var(--purple) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.3);
        }

        .brand-logo i {
            font-size: 32px;
            color: #fff;
        }

        .brand-name {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .brand-tagline {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
        }

        .right-panel {
            width: 540px;
            min-width: 540px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.1);
        }

        .login-form-container {
            width: 100%;
            max-width: 420px;
        }

        .form-header {
            margin-bottom: 36px;
        }

        .form-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 24px;
            display: {% if error %}flex{% else %}none{% endif %};
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .alert.alert-danger {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .alert i {
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            color: var(--text-primary);
            background: #fff;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-input.error {
            border-color: var(--danger);
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        .btn-signin {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-navy) 0%, var(--primary-navy-light) 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-signin:hover {
            background: linear-gradient(135deg, #15304f 0%, var(--primary-navy) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 28, 63, 0.3);
        }

        .signup-link {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            margin-top: 28px;
        }

        .signup-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 1024px) {
            .left-panel {
                display: none;
            }
            .right-panel {
                width: 100%;
                min-width: auto;
                padding: 40px;
            }
        }
    </style>
</head>
<body>
    <!-- Left Panel - Branding & Features -->
    <div class="left-panel">
        <div class="brand-section">
            <div class="brand-logo">
                <i class="fas fa-eye"></i>
            </div>
            <h1 class="brand-name">LinkedEye-FinSpot</h1>
            <p class="brand-tagline">Enterprise Incident Management Platform</p>
        </div>
    </div>

    <!-- Right Panel - Login Form -->
    <div class="right-panel">
        <div class="login-form-container">
            <div class="form-header">
                <h1>Welcome Back</h1>
                <p>Sign in to access your incident management dashboard and monitor your infrastructure.</p>
            </div>

            {% if error %}
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-input" id="email" name="email" placeholder="Enter your work email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-input" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn-signin">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <p class="signup-link">
                Don't have an account? <a href="{{ url_for('register') }}">Request Access</a>
            </p>
        </div>
    </div>
</body>
</html>
