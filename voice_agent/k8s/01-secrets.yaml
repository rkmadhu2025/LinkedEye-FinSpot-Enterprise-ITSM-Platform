# =============================================================================
# SECRET: GitLab Container Registry Authentication
# RECOMMENDED: Create this secret using kubectl command instead of YAML:
#
# kubectl create secret docker-registry gitlab-registry-secret \
#     --namespace=voice-agent \
#     --docker-server=registry.gitlab.com \
#     --docker-username=rajkumarmadhu2024 \
#     --docker-password=YOUR_GITLAB_ACCESS_TOKEN \
#     --docker-email=rajkumarmadhu2024@users.noreply.gitlab.com
#
# This avoids the need to manually base64 encode credentials.
# =============================================================================
# If you prefer YAML, uncomment and replace the placeholder:
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: gitlab-registry-secret
#   namespace: voice-agent
#   labels:
#     app.kubernetes.io/name: voice-agent
#     app.kubernetes.io/component: registry-auth
# type: kubernetes.io/dockerconfigjson
# data:
#   .dockerconfigjson: <BASE64_ENCODED_DOCKER_CONFIG>
---
# =============================================================================
# SECRET: Application Secrets
# Contains sensitive environment variables for the voice-agent application
# IMPORTANT: Replace all placeholder values with actual secrets
# Use: kubectl create secret generic voice-agent-secrets --from-literal=KEY=VALUE
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: voice-agent-secrets
  namespace: voice-agent
  labels:
    app.kubernetes.io/name: voice-agent
    app.kubernetes.io/component: app-secrets
type: Opaque
stringData:
  # Database credentials (replace with actual values)
  DATABASE_URL: "postgresql://user:password@host:5432/voice_agent_db"

  # Redis connection string
  REDIS_URL: "redis://:password@redis-host:6379/0"

  # API keys and tokens (replace with actual values)
  API_SECRET_KEY: "<REPLACE_WITH_SECURE_RANDOM_KEY>"
  JWT_SECRET_KEY: "<REPLACE_WITH_JWT_SECRET>"

  # OpenAI/LLM API keys (if applicable)
  OPENAI_API_KEY: "<REPLACE_WITH_OPENAI_KEY>"

  # Any other sensitive credentials
  ENCRYPTION_KEY: "<REPLACE_WITH_ENCRYPTION_KEY>"
