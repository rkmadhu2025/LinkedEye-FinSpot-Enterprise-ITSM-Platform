# =============================================================================
# INGRESS: voice-agent
# NGINX Ingress with TLS termination via cert-manager
# Exposes the application at https://voice.rmadhu.in
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-agent-ingress
  namespace: voice-agent
  labels:
    app.kubernetes.io/name: voice-agent
    app.kubernetes.io/component: ingress
  annotations:
    # Specify the ingress class
    kubernetes.io/ingress.class: nginx

    # Cert-manager annotation for automatic TLS certificate
    # Replace with your ClusterIssuer name (e.g., letsencrypt-prod)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # NGINX-specific annotations for production
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

    # Enable CORS if needed
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "https://voice.rmadhu.in"

    # Rate limiting (optional)
    # nginx.ingress.kubernetes.io/limit-rps: "100"
    # nginx.ingress.kubernetes.io/limit-connections: "50"

    # SSL redirect (force HTTPS)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # WebSocket support (if your app uses WebSockets)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"

    # Security headers (use server-snippet in ConfigMap if needed)
    # Note: configuration-snippet is disabled by ingress administrator
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - voice.rmadhu.in
      # Certificate secret will be auto-created by cert-manager
      secretName: voice-agent-tls
  rules:
    - host: voice.rmadhu.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voice-agent-service
                port:
                  name: http

---
# =============================================================================
# CERTIFICATE (Optional - explicit certificate request)
# Uncomment if you want explicit control over certificate generation
# Otherwise, cert-manager will auto-create based on Ingress annotations
